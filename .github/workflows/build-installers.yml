name: Build installers

# Builds Windows / macOS / Linux installers when a version tag is pushed.
# Also publishes installer assets to the public Charlsz/entropy-downloads
# releases channel (requires ENTROPY_DOWNLOADS_TOKEN). Private repo Actions
# artifacts remain available for 30 days as a backup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --win --x64
            artifact: entropy-windows
            path: |
              release/*.exe
              release/*.blockmap
          - os: macos-latest
            label: macOS
            args: --mac
            artifact: entropy-macos
            path: |
              release/*.dmg
              release/*.blockmap
          - os: ubuntu-latest
            label: Linux
            args: --linux --x64
            artifact: entropy-linux
            path: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile app
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned private builds until certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-downloads:
    name: Publish to entropy-downloads
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOWNLOADS_REPO: Charlsz/entropy-downloads

    steps:
      - name: Require publish token
        env:
          ENTROPY_DOWNLOADS_TOKEN: ${{ secrets.ENTROPY_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$ENTROPY_DOWNLOADS_TOKEN" ]; then
            echo "::error::Missing secret ENTROPY_DOWNLOADS_TOKEN. Create a fine-grained PAT with Contents: write on Charlsz/entropy-downloads, then add it as a repository secret on Charlsz/entropy. See docs/downloads-channel.md."
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: entropy-*-${{ github.ref_name }}

      - name: Publish GitHub Release on downloads repo
        env:
          GH_TOKEN: ${{ secrets.ENTROPY_DOWNLOADS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          mapfile -t assets < <(find installers -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
          \) | sort)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No installer files found under installers/"
            find installers -type f -print || true
            exit 1
          fi

          echo "Publishing ${#assets[@]} installer(s) to ${DOWNLOADS_REPO}@${TAG}:"
          printf '  %s\n' "${assets[@]}"

          notes="Official Entropy ${VERSION} installers.

          Built automatically from tag \`${TAG}\` in the private app repository.

          - Windows: NSIS x64
          - macOS: universal DMG
          - Linux: AppImage + deb

          Builds may be unsigned until certificates are configured. Prefer downloads from this repository only.
          Site: https://entropy.charlsz.tech"

          notes="$(printf '%s\n' "$notes" | sed 's/^[[:space:]]*//')"

          if gh release view "$TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists on $DOWNLOADS_REPO — uploading assets (clobber)."
            gh release upload "$TAG" "${assets[@]}" --repo "$DOWNLOADS_REPO" --clobber
            gh release edit "$TAG" --repo "$DOWNLOADS_REPO" --notes "$notes" --title "Entropy $VERSION"
          else
            echo "Creating release $TAG on $DOWNLOADS_REPO"
            gh release create "$TAG" "${assets[@]}" \
              --repo "$DOWNLOADS_REPO" \
              --title "Entropy $VERSION" \
              --notes "$notes"
          fi

          echo "Published: https://github.com/${DOWNLOADS_REPO}/releases/tag/${TAG}"
