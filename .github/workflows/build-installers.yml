name: Build installers

# Builds Windows / macOS / Linux installers when a version tag is pushed,
# then attaches them to this repository's GitHub Release for that tag.
# Actions artifacts stay available for 30 days as a backup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --win --x64
            artifact: entropy-windows
            path: |
              release/*.exe
              release/*.blockmap
          - os: macos-latest
            label: macOS
            args: --mac
            artifact: entropy-macos
            path: |
              release/*.dmg
              release/*.blockmap
          - os: ubuntu-latest
            label: Linux
            args: --linux --x64
            artifact: entropy-linux
            path: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile app
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned until certificates are configured (see build/README.md).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: entropy-*-${{ github.ref_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          mapfile -t assets < <(find installers -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
          \) | sort)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No installer files found under installers/"
            find installers -type f -print || true
            exit 1
          fi

          echo "Publishing ${#assets[@]} installer(s) to ${REPO}@${TAG}:"
          printf '  %s\n' "${assets[@]}"

          notes="Official Entropy ${VERSION} installers.

          - Windows: NSIS x64
          - macOS: universal DMG
          - Linux: AppImage + deb

          Builds may be unsigned until certificates are configured. Prefer downloads from this repository's Releases.
          Site: https://entropy.charlsz.tech"

          notes="$(printf '%s\n' "$notes" | sed 's/^[[:space:]]*//')"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets (clobber)."
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes "$notes" --title "Entropy $VERSION"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "${assets[@]}" \
              --repo "$REPO" \
              --title "Entropy $VERSION" \
              --notes "$notes"
          fi

          echo "Published: https://github.com/${REPO}/releases/tag/${TAG}"
