name: Idea
description: A change that helps understand or clean files, or write about them
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Library filter: does this help understand and clean files faster? If it is about meaning/writing, it may belong in Notebook — or not at all. See PRODUCT.md.
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      placeholder: What you are trying to do with your files or notes.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why Entropy
      placeholder: Why this belongs here rather than Finder, Explorer, or another notes app.
    validations:
      required: true
