name: Bug
description: Something in Entropy does not work as PRODUCT.md describes
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Alpha software — thank you for a precise report. Security issues go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.1, git SHA, or installer tag (v0.1.1)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Notebook, Library, Settings, Installer / first launch, Other]
    validations:
      required: true
